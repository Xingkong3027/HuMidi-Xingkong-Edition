name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v2.0.0-xk.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-version:
    name: Verify version and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}

    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Verify APP_VERSION matches tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          content = Path("main.py").read_text(encoding="utf-8")
          match = re.search(
              r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']\s*$',
              content,
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit("APP_VERSION was not found in main.py")
          app_version = match.group(1)
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          print(f"Tag version: {tag_version}")
          print(f"App version: {app_version}")
          if tag_version != app_version:
              raise SystemExit(
                  f"Tag v{tag_version} does not match APP_VERSION {app_version}"
              )
          if re.fullmatch(r"\d+\.\d+\.\d+-xk\.\d+", app_version) is None:
              raise SystemExit(
                  "Xingkong Edition versions must use MAJOR.MINOR.PATCH-xk.N"
              )
          PY

  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    needs: check-version

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.tag }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        shell: pwsh
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --noconsole
          --name HuMidi-Xingkong-Edition
          --icon icon.ico
          --add-data "icon.ico;."
          --add-data "NOTICE.md;."
          --add-data "THIRD_PARTY_NOTICES.md;."
          main.py

      - name: Package Windows distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/windows-package
          Copy-Item dist/HuMidi-Xingkong-Edition.exe dist/windows-package/
          Copy-Item LICENSE,NOTICE.md,THIRD_PARTY_NOTICES.md dist/windows-package/
          Copy-Item LICENSES dist/windows-package/LICENSES -Recurse
          Compress-Archive -Path dist/windows-package/* -DestinationPath dist/HuMidi-Xingkong-Edition-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/HuMidi-Xingkong-Edition.exe
            dist/HuMidi-Xingkong-Edition-Windows.zip
          if-no-files-found: error

  release:
    name: Create GitHub prerelease
    runs-on: ubuntu-latest
    needs: [check-version, build-windows]
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.tag }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          mkdir release-assets
          cp artifacts/windows-exe/HuMidi-Xingkong-Edition.exe release-assets/
          cp artifacts/windows-exe/HuMidi-Xingkong-Edition-Windows.zip release-assets/
          cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md release-assets/
          cp -R LICENSES release-assets/LICENSES
          cd release-assets
          sha256sum \
            HuMidi-Xingkong-Edition.exe \
            HuMidi-Xingkong-Edition-Windows.zip \
            > SHA256SUMS.txt

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: "HuMidi: Xingkong Edition ${{ needs.check-version.outputs.tag }}"
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/HuMidi-Xingkong-Edition.exe
            release-assets/HuMidi-Xingkong-Edition-Windows.zip
            release-assets/SHA256SUMS.txt
            release-assets/LICENSE
            release-assets/NOTICE.md
            release-assets/THIRD_PARTY_NOTICES.md
            release-assets/LICENSES/*
