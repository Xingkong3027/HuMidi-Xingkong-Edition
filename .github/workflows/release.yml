name: Prepare Windows Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v2.1.2-xk.12'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify exact tag and application versions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python qa/check-release-version.py "$env:RELEASE_TAG"
      - name: Build and test portable application
        shell: powershell
        run: .\build-portable.ps1
      - name: Collect dependency licenses
        run: python qa/collect-licenses.py
      - name: Package accompanying notices and hashes
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          Compress-Archive -LiteralPath LICENSE,LICENSES,NOTICE.md,THIRD_PARTY_NOTICES.md -DestinationPath "portable/HuMidi-Xingkong-Edition-$version-Licenses.zip"
          Get-ChildItem portable -File | Where-Object { $_.Extension -ne '.sha256' } | ForEach-Object { "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" } | Set-Content -Encoding ascii portable/SHA256SUMS.txt
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem portable -File | ForEach-Object { $_.FullName })
          gh release create "$env:RELEASE_TAG" --verify-tag --draft --title "HuMidi · Xingkong Edition $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed; an existing release is not overwritten.' }
